spring:
  application:
    name: chat-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  config:
    import: optional:file:.env[.properties]

jwt:
  secret: ${JWT_SECRET_KEY}

main:
  server:
    url: ${MAIN_SERVER_URL}

server:
  port: 8081