  logging {
    level = "info"
  }
    
    loki.write "default" {
    endpoint {
    url = "http://loki:3100/loki/api/v1/push"
    }
  }
    
    local.file_match "chat_logs" {
    path_targets = [
    {
    __path__ = "/var/log/app/chat.log",
    service  = "chat",
    env      = "dev",
    },
    ]
  }
    
    loki.source.file "chat_logs" {
    targets    = local.file_match.chat_logs.targets
    forward_to = [loki.process.chat.receiver]
  }
    
    loki.process "chat" {
    
    stage.json {
    expressions = {
    level   = "level"
    logger  = "logger"
    message = "message"
    }
    }
    
    stage.labels {
    values = {
    level = ""
    }
    }
    
    forward_to = [loki.write.default.receiver]
  }
